name: Software verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-linux:
    name: Focused workflow (Linux, Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: src:third_party/hermes_runtime
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the release inventory
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          manifest = json.loads(Path("release_manifest.json").read_text())
          for member in manifest["members"]:
              content = Path(member["path"]).read_bytes()
              assert len(content) == member["bytes"], member["path"]
              assert hashlib.sha256(content).hexdigest() == member["sha256"], member["path"]
          for name, expected in manifest["code_files"].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          print(f'Verified {len(manifest["members"])} release members and {len(manifest["code_files"])} code pins.')
          PY
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --locked --python 3.11 --extra test
      - name: Check the documented entry point
        run: .venv/bin/python -m nurse_rcl.v2.live.ops_sre_gplus_case --help
      - name: Run the 45-file synthetic verification suite
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t selected_tests < tests/final_explainability_0ark.txt
          test "${#selected_tests[@]}" -eq 45
          .venv/bin/python scripts/dev/run_final_explainability_0ark.py \
            -q --tb=short "${selected_tests[@]}"
